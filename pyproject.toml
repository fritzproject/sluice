[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sluicebox"
version = "0.2.0"
description = "Pluggable download manager: queue, adjustable throughput, resumable transfers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["download", "manager", "queue", "resume", "plugins"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
web = ["flask>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
sluicebox = "sluicebox.cli:main"

# Third-party extractors declare themselves in this group and are discovered
# at startup without touching the core. See docs/writing-extractors.md.
[project.entry-points."sluicebox.extractors"]

[tool.hatch.build.targets.wheel]
packages = ["src/sluicebox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001"]
